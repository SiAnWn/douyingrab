name: DouyinGrab
options:
  bundleIdPrefix: com.sian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DouyinGrab:
    type: application
    platform: iOS
    sources:
      - App
    entitlements:
      path: Generated/DouyinGrab.entitlements
      properties:
        com.apple.security.application-groups:
          - group.0c4608c7ade308d7.1
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 抖音原画质
        CFBundleDevelopmentRegion: zh_CN
        CFBundleURLTypes:
          - CFBundleURLName: com.sian.douyingrab
            CFBundleURLSchemes:
              - douyingrab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
